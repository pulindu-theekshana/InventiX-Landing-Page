<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" fill="none" role="img" aria-label="Festival stock — an oil lamp, rice flour, coconut, treacle and cashew — with the order-by date marked well ahead of the peak" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fvFlame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3C4"/>
      <stop offset="1" stop-color="#FFC800"/>
    </linearGradient>
    <radialGradient id="fvHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFC800" stop-opacity=".38"/>
      <stop offset="1" stop-color="#FFC800" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="108" cy="118" r="104" fill="url(#fvHalo)"/>

  <!-- oil lamp (pahana) -->
  <g>
    <path d="M90 56c0-11 8-20 18-20s18 9 18 20c0 15-18 28-18 28S90 71 90 56Z" fill="url(#fvFlame)"/>
    <path d="M108 48c0-6 4-11 4-11s4 5 4 11-4 9-4 9-4-3-4-9Z" fill="#FFFCF4" opacity=".85"/>
    <path d="M108 86v18" stroke="#501602" stroke-width="5" stroke-linecap="round"/>
    <path d="M56 106h104l-17 30a9 9 0 0 1-8 5H81a9 9 0 0 1-8-5l-17-30Z" fill="#7C3418"/>
    <rect x="48" y="98" width="120" height="11" rx="5.5" fill="#501602"/>
    <path d="M108 141v42" stroke="#501602" stroke-width="7" stroke-linecap="round"/>
    <path d="M74 190h68l12 20H62l12-20Z" fill="#501602"/>
    <rect x="52" y="210" width="112" height="12" rx="6" fill="#7C3418"/>
  </g>

  <!-- the goods, all standing on one baseline -->
  <g>
    <!-- rice flour sack -->
    <path d="M214 150c0-19 16-31 37-31s37 12 37 31v66a6 6 0 0 1-6 6h-62a6 6 0 0 1-6-6v-66Z"
          fill="#E2D2B8" stroke="#501602" stroke-width="3"/>
    <path d="M232 126c9-10 30-10 39 0" stroke="#501602" stroke-width="3" stroke-linecap="round"/>
    <rect x="228" y="166" width="46" height="32" rx="4" fill="#FFFCF4" stroke="#501602" stroke-width="2"/>
    <g fill="#501602" opacity=".65">
      <rect x="236" y="174" width="30" height="5" rx="2.5"/>
      <rect x="236" y="185" width="20" height="5" rx="2.5"/>
    </g>

    <!-- coconut -->
    <circle cx="334" cy="184" r="38" fill="#7C3418"/>
    <path d="M308 162c12-10 40-10 52 0" stroke="#501602" stroke-width="3" stroke-linecap="round" opacity=".55"/>
    <g fill="#501602" opacity=".5">
      <circle cx="322" cy="170" r="4"/><circle cx="336" cy="167" r="4"/><circle cx="349" cy="173" r="4"/>
    </g>

    <!-- treacle pot -->
    <path d="M388 160h62l-8 54a10 10 0 0 1-10 8h-26a10 10 0 0 1-10-8l-8-54Z" fill="#501602"/>
    <rect x="382" y="149" width="74" height="14" rx="7" fill="#7C3418"/>
    <path d="M404 176c11 5 22 5 30 0" stroke="#FFC800" stroke-width="3.5" stroke-linecap="round" opacity=".85"/>

    <!-- cashew, scattered at the base -->
    <g fill="#FFDC61" stroke="#C4910C" stroke-width="2">
      <path d="M468 200c7-7 17-5 19 2s-5 14-12 12-11-9-7-14Z"/>
      <path d="M472 220c6-6 15-4 17 2s-5 13-11 11-10-8-6-13Z"/>
    </g>

    <!-- the shelf they sit on -->
    <rect x="200" y="222" width="300" height="7" rx="3.5" fill="#501602" opacity=".25"/>
  </g>

  <!-- the run-up: order window, then the peak -->
  <g>
    <rect x="48" y="272" width="424" height="9" rx="4.5" fill="#501602" opacity=".14"/>
    <rect x="48" y="272" width="168" height="9" rx="4.5" fill="#FFC800"/>
    <circle cx="216" cy="276.5" r="10" fill="#FFFCF4" stroke="#C4910C" stroke-width="3.5"/>
    <circle cx="452" cy="276.5" r="13" fill="#501602"/>
    <path d="M447 276.5l3.5 3.5L458 272" stroke="#FFC800" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#501602" opacity=".45">
      <rect x="48" y="298" width="104" height="7" rx="3.5"/>
      <rect x="398" y="298" width="74" height="7" rx="3.5"/>
    </g>
  </g>
</svg>
