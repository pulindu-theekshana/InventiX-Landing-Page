<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" fill="none" role="img" aria-label="A delivery lorry on a marked route, with stock cartons and stage pins from the supplier to the shop" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="dvBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFDC61"/>
      <stop offset="1" stop-color="#FFC800"/>
    </linearGradient>
  </defs>

  <!-- route -->
  <path d="M24 262C120 262 128 176 216 176s108 62 196 62h120"
        stroke="#501602" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 12" opacity=".35"/>

  <!-- origin pin: supplier -->
  <g>
    <path d="M40 232c0-13 10-23 23-23s23 10 23 23c0 17-23 34-23 34s-23-17-23-34Z" fill="#7C3418"/>
    <circle cx="63" cy="231" r="8" fill="#FFFCF4"/>
  </g>

  <!-- destination pin: the shop -->
  <g>
    <path d="M474 212c0-15 12-27 27-27s27 12 27 27c0 20-27 40-27 40s-27-20-27-40Z" fill="#501602"/>
    <path d="M490 234v-16l11-9 11 9v16h-8v-10h-6v10h-8Z" fill="#FFC800"/>
  </g>

  <!-- cartons at the origin -->
  <g stroke="#501602" stroke-width="2">
    <rect x="104" y="228" width="44" height="38" rx="3" fill="#E2D2B8"/>
    <path d="M126 228v38M104 244h44"/>
    <rect x="152" y="240" width="34" height="26" rx="3" fill="#F2E7D5"/>
    <path d="M169 240v26"/>
  </g>

  <!-- lorry -->
  <g>
    <!-- box -->
    <rect x="228" y="120" width="132" height="90" rx="6" fill="url(#dvBody)" stroke="#501602" stroke-width="3"/>
    <rect x="248" y="142" width="92" height="46" rx="4" fill="#FFFCF4" opacity=".75"/>
    <g fill="#501602" opacity=".7">
      <rect x="262" y="156" width="42" height="7" rx="3.5"/>
      <rect x="262" y="170" width="26" height="7" rx="3.5"/>
    </g>
    <!-- cab -->
    <path d="M360 152h42l30 34v24h-72v-58Z" fill="#7C3418" stroke="#501602" stroke-width="3" stroke-linejoin="round"/>
    <path d="M368 160h30l20 24h-50v-24Z" fill="#E3F2E5" opacity=".9"/>
    <!-- chassis -->
    <rect x="222" y="206" width="216" height="12" rx="4" fill="#501602"/>
    <!-- wheels -->
    <g>
      <circle cx="268" cy="228" r="20" fill="#1A0704"/>
      <circle cx="268" cy="228" r="8" fill="#E2D2B8"/>
      <circle cx="404" cy="228" r="20" fill="#1A0704"/>
      <circle cx="404" cy="228" r="8" fill="#E2D2B8"/>
    </g>
    <!-- motion lines -->
    <g stroke="#C4910C" stroke-width="3" stroke-linecap="round" opacity=".6">
      <path d="M196 148h30M182 166h24M204 184h22"/>
    </g>
  </g>

  <!-- stage ticks along the route -->
  <g>
    <circle cx="140" cy="272" r="7" fill="#086C1A"/>
    <circle cx="216" cy="272" r="7" fill="#086C1A"/>
    <circle cx="292" cy="272" r="7" fill="#FFC800" stroke="#501602" stroke-width="2"/>
    <circle cx="368" cy="272" r="7" fill="#FFFCF4" stroke="#501602" stroke-width="2" stroke-opacity=".35"/>
    <circle cx="444" cy="272" r="7" fill="#FFFCF4" stroke="#501602" stroke-width="2" stroke-opacity=".35"/>
    <path d="M140 272h304" stroke="#501602" stroke-width="2" opacity=".18"/>
  </g>
</svg>
