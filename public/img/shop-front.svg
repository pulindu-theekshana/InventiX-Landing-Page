<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" fill="none" role="img" aria-label="A Sri Lankan neighbourhood grocery shop with shelves of stock and crates outside" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sfSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6E0"/>
      <stop offset="1" stop-color="#FFFCF4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sfGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33130A"/>
      <stop offset="1" stop-color="#1A0704"/>
    </linearGradient>
    <clipPath id="sfBayL"><rect x="62" y="132" width="216" height="186" rx="4"/></clipPath>
    <clipPath id="sfBayR"><rect x="358" y="132" width="216" height="186" rx="4"/></clipPath>
  </defs>

  <!-- warm sky wash -->
  <rect x="0" y="0" width="640" height="300" fill="url(#sfSky)"/>

  <!-- palms -->
  <g stroke="#086C1A" stroke-width="3" stroke-linecap="round" opacity=".55">
    <path d="M26 300V186"/>
    <path d="M26 190c-16-16-34-20-48-14M26 190c14-18 32-24 46-18M26 196c-18-6-32 0-40 12M26 196c18-8 32-4 42 8"/>
    <path d="M614 300V202"/>
    <path d="M614 206c12-14 26-18 38-13M614 206c-12-16-26-20-36-15M614 214c14-6 24-2 30 8"/>
  </g>

  <!-- power line + birds -->
  <path d="M0 62c210 30 430 30 640 0" stroke="#501602" stroke-width="1.5" opacity=".25"/>
  <g fill="#501602" opacity=".5">
    <path d="M182 74c3-4 5-4 8 0 3-4 5-4 8 0-5 3-11 3-16 0Z"/>
    <path d="M432 76c3-4 5-4 8 0 3-4 5-4 8 0-5 3-11 3-16 0Z"/>
  </g>

  <!-- building -->
  <rect x="40" y="104" width="560" height="226" rx="6" fill="#F2E7D5"/>
  <!-- signboard -->
  <rect x="58" y="40" width="524" height="62" rx="6" fill="#FFFCF4" stroke="#501602" stroke-width="2"/>
  <g fill="#501602">
    <rect x="86" y="60" width="120" height="16" rx="3"/>
    <rect x="216" y="60" width="52" height="16" rx="3"/>
    <rect x="278" y="60" width="86" height="16" rx="3"/>
  </g>
  <g fill="#C4910C">
    <rect x="378" y="60" width="38" height="16" rx="3"/>
    <rect x="426" y="60" width="70" height="16" rx="3"/>
  </g>
  <!-- awning shadow -->
  <rect x="40" y="102" width="560" height="10" rx="3" fill="#501602" opacity=".18"/>

  <!-- left bay -->
  <rect x="58" y="128" width="224" height="194" rx="6" fill="url(#sfGlass)"/>
  <g clip-path="url(#sfBayL)">
    <g stroke="#FFFCF4" stroke-opacity=".22" stroke-width="2">
      <path d="M62 178h216M62 224h216M62 270h216"/>
    </g>
    <!-- shelf stock -->
    <g>
      <rect x="76" y="152" width="22" height="24" rx="2" fill="#FFC800"/>
      <rect x="104" y="146" width="18" height="30" rx="2" fill="#C4910C"/>
      <rect x="128" y="154" width="26" height="22" rx="2" fill="#E3F2E5"/>
      <rect x="160" y="148" width="20" height="28" rx="2" fill="#FFDC61"/>
      <rect x="186" y="156" width="24" height="20" rx="2" fill="#7C3418"/>
      <rect x="216" y="150" width="18" height="26" rx="2" fill="#FFC800"/>
      <rect x="240" y="154" width="26" height="22" rx="2" fill="#086C1A"/>

      <rect x="74" y="200" width="26" height="22" rx="2" fill="#E3F2E5"/>
      <rect x="106" y="196" width="20" height="26" rx="2" fill="#FFC800"/>
      <rect x="132" y="202" width="24" height="20" rx="2" fill="#C4910C"/>
      <rect x="162" y="194" width="18" height="28" rx="2" fill="#FFDC61"/>
      <rect x="186" y="200" width="28" height="22" rx="2" fill="#7C3418"/>
      <rect x="220" y="198" width="20" height="24" rx="2" fill="#086C1A"/>

      <rect x="78" y="246" width="30" height="24" rx="2" fill="#FFDC61"/>
      <rect x="114" y="242" width="22" height="28" rx="2" fill="#E3F2E5"/>
      <rect x="142" y="248" width="26" height="22" rx="2" fill="#FFC800"/>
      <rect x="174" y="244" width="20" height="26" rx="2" fill="#C4910C"/>
      <rect x="200" y="250" width="28" height="20" rx="2" fill="#086C1A"/>
    </g>
  </g>
  <rect x="58" y="128" width="224" height="194" rx="6" stroke="#501602" stroke-width="2.5"/>

  <!-- right bay -->
  <rect x="354" y="128" width="224" height="194" rx="6" fill="url(#sfGlass)"/>
  <g clip-path="url(#sfBayR)">
    <g stroke="#FFFCF4" stroke-opacity=".22" stroke-width="2">
      <path d="M358 178h216M358 224h216M358 270h216"/>
    </g>
    <g>
      <rect x="372" y="150" width="20" height="26" rx="2" fill="#086C1A"/>
      <rect x="398" y="154" width="26" height="22" rx="2" fill="#FFC800"/>
      <rect x="430" y="146" width="18" height="30" rx="2" fill="#E3F2E5"/>
      <rect x="454" y="152" width="24" height="24" rx="2" fill="#C4910C"/>
      <rect x="484" y="148" width="20" height="28" rx="2" fill="#FFDC61"/>
      <rect x="510" y="156" width="26" height="20" rx="2" fill="#7C3418"/>

      <rect x="370" y="198" width="28" height="24" rx="2" fill="#FFC800"/>
      <rect x="404" y="202" width="20" height="20" rx="2" fill="#7C3418"/>
      <rect x="430" y="196" width="24" height="26" rx="2" fill="#E3F2E5"/>
      <rect x="460" y="200" width="18" height="22" rx="2" fill="#086C1A"/>
      <rect x="484" y="194" width="26" height="28" rx="2" fill="#FFDC61"/>

      <!-- the gap: this row has run out -->
      <rect x="370" y="246" width="26" height="24" rx="2" fill="#C4910C"/>
      <rect x="402" y="250" width="22" height="20" rx="2" fill="#FFC800"/>
      <rect x="500" y="248" width="24" height="22" rx="2" fill="#E3F2E5"/>
      <rect x="530" y="244" width="18" height="26" rx="2" fill="#086C1A"/>
      <g opacity=".45" stroke="#B02A0E" stroke-width="2" stroke-dasharray="4 4">
        <rect x="434" y="244" width="58" height="26" rx="3"/>
      </g>
    </g>
  </g>
  <rect x="354" y="128" width="224" height="194" rx="6" stroke="#501602" stroke-width="2.5"/>

  <!-- pillar between bays -->
  <rect x="294" y="128" width="48" height="194" rx="4" fill="#E2D2B8"/>
  <rect x="302" y="150" width="32" height="44" rx="3" fill="#FFC800" opacity=".85"/>
  <rect x="302" y="204" width="32" height="34" rx="3" fill="#7C3418" opacity=".55"/>

  <!-- step -->
  <rect x="26" y="330" width="588" height="16" rx="4" fill="#E2D2B8"/>
  <rect x="10" y="346" width="620" height="14" rx="4" fill="#D9C6A8"/>

  <!-- crates outside -->
  <g>
    <rect x="248" y="288" width="64" height="42" rx="4" fill="#B02A0E" opacity=".85"/>
    <g fill="#FFFCF4" opacity=".75">
      <circle cx="262" cy="300" r="5"/><circle cx="280" cy="300" r="5"/><circle cx="298" cy="300" r="5"/>
      <circle cx="262" cy="316" r="5"/><circle cx="280" cy="316" r="5"/><circle cx="298" cy="316" r="5"/>
    </g>
    <rect x="316" y="296" width="58" height="34" rx="4" fill="#086C1A" opacity=".8"/>
    <g fill="#FFFCF4" opacity=".7">
      <circle cx="330" cy="306" r="4.5"/><circle cx="346" cy="306" r="4.5"/><circle cx="362" cy="306" r="4.5"/>
      <circle cx="330" cy="320" r="4.5"/><circle cx="346" cy="320" r="4.5"/><circle cx="362" cy="320" r="4.5"/>
    </g>
  </g>

  <!-- rice sacks -->
  <g fill="#E2D2B8" stroke="#501602" stroke-width="1.5" opacity=".9">
    <path d="M100 302c0-8 8-12 18-12s18 4 18 12v22a4 4 0 0 1-4 4h-28a4 4 0 0 1-4-4v-22Z"/>
    <path d="M142 308c0-7 7-10 15-10s15 3 15 10v18a4 4 0 0 1-4 4h-22a4 4 0 0 1-4-4v-18Z"/>
  </g>
</svg>
