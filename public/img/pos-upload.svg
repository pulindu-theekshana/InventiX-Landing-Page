<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" fill="none" role="img" aria-label="A till receipt exported as a file, its columns matched to the product catalogue, reducing stock automatically" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- till -->
  <g>
    <rect x="28" y="150" width="140" height="96" rx="8" fill="#7C3418"/>
    <rect x="42" y="166" width="112" height="34" rx="4" fill="#E3F2E5"/>
    <g fill="#501602" opacity=".6">
      <rect x="52" y="176" width="46" height="6" rx="3"/>
      <rect x="52" y="188" width="30" height="6" rx="3"/>
    </g>
    <g fill="#FFC800">
      <rect x="46" y="212" width="20" height="14" rx="3"/>
      <rect x="72" y="212" width="20" height="14" rx="3"/>
      <rect x="98" y="212" width="20" height="14" rx="3"/>
      <rect x="124" y="212" width="20" height="14" rx="3"/>
    </g>
    <rect x="20" y="246" width="156" height="12" rx="4" fill="#501602"/>
  </g>

  <!-- receipt curling up out of the till -->
  <g>
    <path d="M56 150V64c0-6 5-10 11-10h62c6 0 11 4 11 10v18c0 6 5 10 11 10h10"
          stroke="#501602" stroke-width="2" fill="#FFFCF4" stroke-linejoin="round"/>
    <g fill="#501602" opacity=".45">
      <rect x="68" y="72" width="54" height="5" rx="2.5"/>
      <rect x="68" y="84" width="40" height="5" rx="2.5"/>
      <rect x="68" y="96" width="48" height="5" rx="2.5"/>
      <rect x="68" y="108" width="34" height="5" rx="2.5"/>
      <rect x="68" y="120" width="44" height="5" rx="2.5"/>
    </g>
  </g>

  <!-- flow arrow -->
  <g>
    <path d="M196 148h84" stroke="#C4910C" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 10"/>
    <path d="M282 148l-12-8v16l12-8Z" fill="#C4910C"/>
    <rect x="200" y="112" width="76" height="22" rx="11" fill="#FFF3C4"/>
    <g fill="#501602" opacity=".65">
      <rect x="212" y="120" width="52" height="6" rx="3"/>
    </g>
  </g>

  <!-- matched catalogue table -->
  <g>
    <rect x="296" y="72" width="200" height="200" rx="10" fill="#FFFCF4" stroke="#501602" stroke-width="2.5"/>
    <rect x="296" y="72" width="200" height="34" rx="10" fill="#501602"/>
    <rect x="296" y="96" width="200" height="10" fill="#501602"/>
    <g fill="#FFC800">
      <rect x="312" y="84" width="46" height="7" rx="3.5"/>
      <rect x="378" y="84" width="34" height="7" rx="3.5"/>
      <rect x="430" y="84" width="50" height="7" rx="3.5"/>
    </g>

    <g stroke="#501602" stroke-opacity=".12" stroke-width="1.5">
      <path d="M296 142h200M296 178h200M296 214h200M296 250h200"/>
    </g>

    <!-- rows: raw till name on the left, matched product on the right -->
    <g>
      <rect x="312" y="118" width="62" height="7" rx="3.5" fill="#501602" opacity=".35"/>
      <path d="M382 121h16" stroke="#C4910C" stroke-width="2" stroke-linecap="round"/>
      <rect x="406" y="118" width="58" height="7" rx="3.5" fill="#501602" opacity=".75"/>
      <circle cx="478" cy="121" r="7" fill="#E3F2E5"/>
      <path d="M475 121l2.5 2.5L482 118" stroke="#086C1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="312" y="154" width="52" height="7" rx="3.5" fill="#501602" opacity=".35"/>
      <path d="M382 157h16" stroke="#C4910C" stroke-width="2" stroke-linecap="round"/>
      <rect x="406" y="154" width="46" height="7" rx="3.5" fill="#501602" opacity=".75"/>
      <circle cx="478" cy="157" r="7" fill="#E3F2E5"/>
      <path d="M475 157l2.5 2.5L482 154" stroke="#086C1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="312" y="190" width="68" height="7" rx="3.5" fill="#501602" opacity=".35"/>
      <path d="M388 193h10" stroke="#C4910C" stroke-width="2" stroke-linecap="round"/>
      <rect x="406" y="190" width="54" height="7" rx="3.5" fill="#501602" opacity=".75"/>
      <circle cx="478" cy="193" r="7" fill="#E3F2E5"/>
      <path d="M475 193l2.5 2.5L482 190" stroke="#086C1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- one needs a human decision -->
      <rect x="312" y="226" width="58" height="7" rx="3.5" fill="#501602" opacity=".35"/>
      <path d="M382 229h16" stroke="#C4910C" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>
      <rect x="406" y="226" width="42" height="7" rx="3.5" fill="#501602" opacity=".2"/>
      <circle cx="478" cy="229" r="7" fill="#FFF3C4" stroke="#C4910C" stroke-width="1.5"/>
      <path d="M478 225.5v4M478 232.5v.5" stroke="#C4910C" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- footer: stock reduced -->
    <g>
      <rect x="312" y="256" width="94" height="8" rx="4" fill="#086C1A" opacity=".75"/>
      <rect x="418" y="256" width="62" height="8" rx="4" fill="#501602" opacity=".25"/>
    </g>
  </g>
</svg>
